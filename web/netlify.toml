"$schema" = "https://open-api.netlify.com/netlify.schema.json"

# Both Netlify sites use base directory web and read this one file: Payroll
# (VITE_APP_SURFACE unset) and the employee site (VITE_APP_SURFACE=employee).
# Netlify has no per-site config file, so the surface comes from the site's own
# environment variables. `npm run build` ends with scripts/finalize-surface-dist.mjs,
# which writes Payroll's build-configured _headers or the employee site's _headers and _redirects.
# See docs/rollout/M4_EMPLOYEE_PLATFORM_RUNBOOK.md.
[build]
  command = "npm run build"
  publish = "dist"
  ignore = "bash ./scripts/netlify-ignore-build.sh"
