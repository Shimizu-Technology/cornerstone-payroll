name: Quality
run-name: ${{ inputs.payroll_sha && format('Connected payroll {0} + {1}', inputs.payroll_sha, inputs.aire_sha) || format('Quality {0}', github.ref_name) }}

on:
  pull_request:
  push:
    branches: [main, staging-v2]
  workflow_dispatch:
    inputs:
      payroll_sha:
        description: Optional full Payroll SHA for exact-pair certification (supply both SHAs)
        required: false
        type: string
      aire_sha:
        description: Optional full AIRE SHA for exact-pair certification (supply both SHAs)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  connected-payroll:
    name: Connected payroll exact-pair certification
    if: github.event_name == 'workflow_dispatch' && (inputs.payroll_sha != '' || inputs.aire_sha != '')
    needs: [backend, frontend, browser, staging-v2-configuration]
    uses: ./.github/workflows/connected-payroll.yml
    with:
      payroll_sha: ${{ inputs.payroll_sha }}
      aire_sha: ${{ inputs.aire_sha }}

  # Stable required context: never let a failed/skipped shard pass the gate.
  backend:
    if: always()
    needs: [backend-checks, backend-specs]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s .github/scripts/tests -v
      - name: Require every backend job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-specs-*
          path: tmp/quality-rspec
          merge-multiple: true
      - name: Prove full RSpec coverage and collect timings
        run: python3 .github/scripts/quality_rspec.py verify --count 3 --directory tmp/quality-rspec
      - uses: actions/cache/save@v4
        with:
          path: tmp/quality-rspec/timings.json
          key: quality-rspec-timings-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-proof
          path: tmp/quality-rspec

  # One timing snapshot and three isolated processes share one runner slot.
  backend-specs:
    name: Backend RSpec workers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: api
    env:
      RAILS_ENV: test
      AUTH_ENABLED: "false"
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: api
      - uses: actions/cache/restore@v4
        with:
          path: tmp/quality-rspec/timings.json
          key: quality-rspec-timings-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: quality-rspec-timings-
      - name: Run three isolated RSpec workers
        run: bash ../.github/scripts/quality-rspec-workers.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-specs-workers
          path: tmp/quality-rspec/results
          if-no-files-found: error

  backend-checks:
    # Keep the Ruby runner on Ubuntu 24.04 for consistent build availability.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cornerstone_payroll_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      pgbouncer:
        image: edoburu/pgbouncer:v1.24.1-p1
        env:
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: cornerstone_payroll_test
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          DEFAULT_POOL_SIZE: 4
        ports: [6439:5432]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d cornerstone_payroll_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      RAILS_ENV: test
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cornerstone_payroll_test
      AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: api
      # Schema-only setup keeps deterministic test fixtures separate from
      # operational tax-rule seeds loaded by db:prepare on a new database.
      - run: bundle exec rails db:schema:load
      - run: bundle exec rails db:integrity
      - run: bundle exec rubocop
      # Pay rates change only through EmployeeCompensationChangeService (M3-4).
      - run: bundle exec rails compensation:lint_writes
      # Hosted databases are reached through PgBouncer in transaction mode,
      # where consecutive statements can run on different server backends.
      - name: Payment transition lock through a transaction-mode pooler
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:6439/cornerstone_payroll_test
          TRANSACTION_POOLER_URL: postgres://postgres:postgres@127.0.0.1:6439/cornerstone_payroll_test
          TRANSACTION_POOLER_DIRECT_URL: postgres://postgres:postgres@127.0.0.1:5432/cornerstone_payroll_test
          DB_PREPARED_STATEMENTS: "false"
          # These lock-only specs deliberately use the pooled primary. RLS
          # isolation is exercised over direct PostgreSQL in backend-specs.
          RLS_CONTEXT_GUARD_MODE: "off"
        run: bundle exec rspec spec/services/payment_transition_lock_transaction_pooler_spec.rb spec/services/payment_transition_lock_spec.rb
      - run: bundle exec brakeman -q
      - run: bundle exec bundler-audit check --update

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run audit:gate
      - run: bash scripts/test-netlify-ignore-build.sh
      - run: npm run gate
        env:
          DEPLOYMENT_ENV: production
          VITE_DEPLOYMENT_ENV: production
          VITEST_MAX_WORKERS: "3"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install Playwright Chromium
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/apt-refresh.sh"
          npx playwright install --with-deps chromium
      - run: npm run test:e2e:public
        env:
          VITE_AUTH_ENABLED: "false"
          VITE_CLERK_PUBLISHABLE_KEY: ""

  # Stateful lanes stay serial within one runner; their fixtures remain isolated.
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cornerstone_payroll_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      AUTH_ENABLED: "false"
      E2E_TEST_MODE: "true"
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cornerstone_payroll_test
      E2E_FIXTURE_PATH: ${{ github.workspace }}/web/.e2e-fixtures/release.json
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "3.3.14"
          bundler-cache: true
          working-directory: api
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: bundle exec rails db:schema:load db:seed
        working-directory: api
      - run: bundle exec rails e2e:seed
        working-directory: api
      - run: npm ci
        working-directory: web
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install Playwright Chromium
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/apt-refresh.sh"
          npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e:release
        working-directory: web
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate0-browser-evidence-release
          path: |
            web/playwright-report
            web/test-results
            web/.e2e-fixtures/release.json
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare isolated payroll refresh acceptance fixture
        if: ${{ !cancelled() }}
        working-directory: api
        env:
          PGPASSWORD: postgres
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cornerstone_payroll_refresh_qa
          E2E_FIXTURE_PATH: ${{ github.workspace }}/web/.e2e-fixtures/payroll-refresh.json
        run: |
          createdb --host 127.0.0.1 --username postgres cornerstone_payroll_refresh_qa
          bundle exec rails db:schema:load db:seed
          bundle exec rails runner 'require Rails.root.join("lib/payroll_refresh_qa_fixture"); PayrollRefreshQaFixture.seed!(output_path: ENV.fetch("E2E_FIXTURE_PATH"))'
      - name: Payroll refresh acceptance
        if: ${{ !cancelled() }}
        working-directory: web
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cornerstone_payroll_refresh_qa
          E2E_FIXTURE_PATH: ${{ github.workspace }}/web/.e2e-fixtures/payroll-refresh.json
        run: npm run test:e2e:refresh
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate0-browser-evidence-refresh
          path: |
            web/playwright-report
            web/test-results
            web/.e2e-fixtures/payroll-refresh.json
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare isolated pay-item workflow fixture
        if: ${{ !cancelled() }}
        working-directory: api
        env:
          PGPASSWORD: postgres
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cornerstone_payroll_pay_items_qa
          E2E_TEST_MODE: "true"
          E2E_FIXTURE_PATH: ${{ github.workspace }}/web/.e2e-fixtures/pay-items.json
        run: |
          createdb --host 127.0.0.1 --username postgres cornerstone_payroll_pay_items_qa
          bundle exec rails db:schema:load
          bundle exec rails runner 'require Rails.root.join("lib/pay_item_workflow_qa_fixture"); PayItemWorkflowQaFixture.seed!(output_path: ENV.fetch("E2E_FIXTURE_PATH"))'
      - name: Pay-item workflow acceptance
        if: ${{ !cancelled() }}
        working-directory: web
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cornerstone_payroll_pay_items_qa
          E2E_FIXTURE_PATH: ${{ github.workspace }}/web/.e2e-fixtures/pay-items.json
        run: npm run test:e2e:pay-items
      - name: Upload pay-item browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pay-item-browser-evidence
          path: |
            web/playwright-report
            web/test-results
            web/.e2e-fixtures/pay-items.json
          if-no-files-found: warn
          retention-days: 14

  staging-v2-configuration:
    name: Staging v2 configuration
    if: github.event_name == 'push' || github.base_ref == 'staging-v2' || (github.event_name == 'workflow_dispatch' && (inputs.payroll_sha != '' || inputs.aire_sha != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        env:
          AIRE_POSTGRES_PASSWORD: validation-only
          PAYROLL_POSTGRES_PASSWORD: validation-only
          AIRE_SECRET_KEY_BASE: validation-only
          PAYROLL_SECRET_KEY_BASE: validation-only
          AIRE_ENCRYPTION_PRIMARY_KEY: validation-only
          AIRE_ENCRYPTION_DETERMINISTIC_KEY: validation-only
          AIRE_ENCRYPTION_KEY_DERIVATION_SALT: validation-only
          PAYROLL_ENCRYPTION_PRIMARY_KEY: validation-only
          PAYROLL_ENCRYPTION_DETERMINISTIC_KEY: validation-only
          PAYROLL_ENCRYPTION_KEY_DERIVATION_SALT: validation-only
          AIRE_CLERK_SECRET_KEY: sk_test_validation
          PAYROLL_CLERK_SECRET_KEY: sk_test_validation
          PAYROLL_CLERK_PUBLISHABLE_KEY: pk_test_validation
          PAYROLL_SHARED_SECRET: validation-only
          AIRE_IMAGE_TAG: validation
          PAYROLL_IMAGE_TAG: validation
          AIRE_PUBLIC_URL: https://aire-staging-v2.example.test
          AIRE_PUBLIC_HOST: aire-staging-v2.example.test
          PAYROLL_PUBLIC_URL: https://payroll-staging-v2.example.test
          AIRE_CLERK_JWKS_URL: https://clerk.example.test/.well-known/jwks.json
          AIRE_CLERK_ISSUER: https://clerk.example.test
          AIRE_STAGING_ADMIN_CLERK_ID: user_validation
          PAYROLL_STAGING_ADMIN_CLERK_ID: user_validation
          STAGING_ADMIN_EMAIL: staging@example.test
        run: docker compose -f ops/staging-v2/compose.yml config --quiet
      - name: Check staging v2 isolation boundaries
        env:
          AIRE_POSTGRES_PASSWORD: validation-only
          PAYROLL_POSTGRES_PASSWORD: validation-only
          AIRE_SECRET_KEY_BASE: validation-only
          PAYROLL_SECRET_KEY_BASE: validation-only
          AIRE_ENCRYPTION_PRIMARY_KEY: validation-only
          AIRE_ENCRYPTION_DETERMINISTIC_KEY: validation-only
          AIRE_ENCRYPTION_KEY_DERIVATION_SALT: validation-only
          PAYROLL_ENCRYPTION_PRIMARY_KEY: validation-only
          PAYROLL_ENCRYPTION_DETERMINISTIC_KEY: validation-only
          PAYROLL_ENCRYPTION_KEY_DERIVATION_SALT: validation-only
          AIRE_CLERK_SECRET_KEY: sk_test_validation
          PAYROLL_CLERK_SECRET_KEY: sk_test_validation
          PAYROLL_CLERK_PUBLISHABLE_KEY: pk_test_validation
          PAYROLL_SHARED_SECRET: validation-only
          AIRE_IMAGE_TAG: validation
          PAYROLL_IMAGE_TAG: validation
          AIRE_PUBLIC_URL: https://aire-staging-v2.example.test
          AIRE_PUBLIC_HOST: aire-staging-v2.example.test
          PAYROLL_PUBLIC_URL: https://payroll-staging-v2.example.test
          AIRE_CLERK_JWKS_URL: https://clerk.example.test/.well-known/jwks.json
          AIRE_CLERK_ISSUER: https://clerk.example.test
          AIRE_STAGING_ADMIN_CLERK_ID: user_validation
          PAYROLL_STAGING_ADMIN_CLERK_ID: user_validation
          STAGING_ADMIN_EMAIL: staging@example.test
        run: |
          docker compose -f ops/staging-v2/compose.yml config --format json | jq -e '
            (.name == "aire-payroll-staging-v2") and
            (.networks.backend.internal == true) and
            (.networks.integration.internal == true) and
            (.networks.egress.internal != true) and
            ((.services."aire-db".ports // []) | length == 0) and
            ((.services."payroll-db".ports // []) | length == 0) and
            ((.services."aire-api".ports // []) | length == 0) and
            ((.services."payroll-api".ports // []) | length == 0) and
            (.services."aire-web".ports[0].host_ip == "127.0.0.1") and
            (.services."aire-web".ports[0].published == "8889") and
            (.services."payroll-web".ports[0].host_ip == "127.0.0.1") and
            (.services."payroll-web".ports[0].published == "8890") and
            (.services."aire-api".environment.DEPLOYMENT_ENV == "staging") and
            (.services."payroll-api".environment.DEPLOYMENT_ENV == "staging") and
            (.services."payroll-api".environment.R2_STORAGE_BACKEND == "local") and
            (.services."payroll-worker".environment.R2_STORAGE_BACKEND == "local")
          '
      - name: Check deployment scripts
        run: bash -n ops/staging-v2/*.sh
      - name: Test connected deployment gates
        working-directory: ops/staging-v2
        run: python3 -m unittest discover -p "test_*.py"
      - name: Validate staging v2 LaunchAgent
        run: python3 -c 'import plistlib; plistlib.load(open("ops/staging-v2/launchd/com.shimizutechnology.aire-payroll-staging-v2.plist", "rb"))'
      - name: Build staging API image
        run: docker build --file api/Dockerfile --tag cornerstone-payroll-api:ci api
      - name: Build staging web image
        env:
          STAGING_CLERK_PUBLISHABLE_KEY: ${{ secrets.STAGING_CLERK_PUBLISHABLE_KEY }}
        run: >-
          docker build --file web/Dockerfile --tag cornerstone-payroll-web:ci
          --build-arg DEPLOYMENT_ENV=staging
          --build-arg VITE_DEPLOYMENT_ENV=staging
          --build-arg VITE_STAGING_SNAPSHOT_AT=1970-01-01T00:00:00Z
          --build-arg VITE_STAGING_CODE_SHA="${{ github.sha }}"
          --build-arg VITE_STAGING_AIRE_FRONTEND_ORIGIN=https://aire-staging.example.test
          --build-arg VITE_API_URL=https://payroll-api-staging.example.test/api/v1
          --build-arg VITE_AUTH_ENABLED=true
          --build-arg VITE_CLERK_PUBLISHABLE_KEY="${STAGING_CLERK_PUBLISHABLE_KEY}"
          web
      - name: Validate staging Caddyfile
        run: >-
          docker run --rm --entrypoint caddy cornerstone-payroll-web:ci
          validate --config /etc/caddy/Caddyfile --adapter caddyfile

  publish-staging-v2-images:
    name: Publish staging v2 images
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging-v2'
    needs:
      - backend
      - frontend
      - browser
      - staging-v2-configuration
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: cornerstone-payroll-api
            context: api
            file: api/Dockerfile
          - image: cornerstone-payroll-web
            context: web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish API image
        if: matrix.image == 'cornerstone-payroll-api'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/shimizu-technology/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/shimizu-technology/${{ matrix.image }}:staging-v2
      # A contained staging web build needs its exact origins, snapshot time and
      # publishable key. Until all exist, skip only the web image instead of
      # failing the run; the API image still publishes. Secrets cannot be read
      # in `if:`, so a preflight step reports whether everything is configured.
      - name: Check staging web configuration
        id: staging_web
        if: matrix.image == 'cornerstone-payroll-web'
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          STAGING_SNAPSHOT_AT: ${{ vars.STAGING_SNAPSHOT_AT }}
          STAGING_AIRE_FRONTEND_ORIGIN: ${{ vars.STAGING_AIRE_FRONTEND_ORIGIN }}
          STAGING_CLERK_PUBLISHABLE_KEY: ${{ secrets.STAGING_CLERK_PUBLISHABLE_KEY }}
        run: |
          missing=""
          for name in STAGING_API_URL STAGING_SNAPSHOT_AT STAGING_AIRE_FRONTEND_ORIGIN STAGING_CLERK_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Staging web image skipped::Missing:$missing. Set these repository variables/secret to publish a contained staging web image."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish web image
        if: matrix.image == 'cornerstone-payroll-web' && steps.staging_web.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/shimizu-technology/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/shimizu-technology/${{ matrix.image }}:staging-v2
          build-args: |
            DEPLOYMENT_ENV=staging
            VITE_DEPLOYMENT_ENV=staging
            VITE_STAGING_SNAPSHOT_AT=${{ vars.STAGING_SNAPSHOT_AT }}
            VITE_STAGING_CODE_SHA=${{ github.sha }}
            VITE_STAGING_AIRE_FRONTEND_ORIGIN=${{ vars.STAGING_AIRE_FRONTEND_ORIGIN }}
            VITE_API_URL=${{ vars.STAGING_API_URL }}
            VITE_AUTH_ENABLED=true
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.STAGING_CLERK_PUBLISHABLE_KEY }}
