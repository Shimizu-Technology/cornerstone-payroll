# Track C characterization of the existing adapter. Verified by the intake golden specs.
key: mosa_revel
parser_version: mosa_revel:v1
extraction: deterministic
idempotency: files_period_roster_loans_and_workweek
files:
  revel_hours:
    extensions: [.pdf]
    content_type: application/pdf
    max: 1
    required_by_default: true
    portal_role: revel_payroll
  supplemental_workbook:
    extensions: [.xlsx, .xls]
    max: 1
    required_by_default: true
    waiver_label: No tips or loans this period
    portal_role: changes_workbook
revel_hours:
  header_pattern: 'Employee.*Role.*Ext\. ID.*Wage.*Regular h\.'
  columns_zero_based_inclusive:
    employee: [0, 39]
    role: [40, 59]
    ext_id: [60, 79]
    wage: [80, 99]
    regular_hours: [100, 119]
    overtime_hours: [120, 139]
    doubletime_hours: [140, 159]
    regular_pay: [160, 179]
    overtime_pay: [180, 199]
    doubletime_pay: [200, 219]
    total_hours: [220, 239]
    total_pay: [240, 259]
    fees: [260, 279]
  employee_match: fuzzy_name_against_active_roster
  totals: A Totals line containing a decimal ends the table. It is not reconciled.
  payroll_fields:
    regular_hours: hours_worked
    overtime_hours: overtime_hours
    doubletime_hours: parsed from the PDF but omitted by ImportService before the adapter's double-time review check
    total_hours: source evidence
    wage_and_pay: use Cornerstone compensation
workbook:
  generated:
    schema_versions: [cornerstone-mosa-supplemental/v1, cornerstone-mosa-supplemental/v2]
    detection_sheet: START HERE
    metadata_columns: {label: A, value: B}
    metadata_labels: [Schema version, Company ID, Company, Pay period start, Pay period end, Pay date, Template revision, Prior revision replaced, Submitter, Submitted at, Revel filename, 'No supplemental changes? (YES/NO)', Attestation]
    merged_ranges: ['A1:D1', 'A2:D2']
    employee_match: stable_employee_id_against_active_roster
    header_row: 1
    first_data_row: 2
    sheets:
      EMPLOYEE CHANGES:
        required: true
        columns: [Employee ID, Employee, Department, BOH tips, FOH tips, 'Tips already paid? (YES/NO)', Source / reason, Notes]
        v1_columns_g_to_l: [bonus, one_payroll_deduction, effective_date, recipient, source, notes]
      OWNER PERIOD PAY:
        required: false
        columns: [Employee ID, Employee, Pay this employee, Scope confirmation, Effective pay date, Source / reason, Notes]
      ONE-TIME COMPONENTS:
        required: false
        columns: [Employee ID, Employee, Type, Label, Amount, Category, Recipient / payee, Effective pay date, Source / reason, Notes]
      DEDUCTIONS & LOANS:
        required: true
        columns: [Employee ID, Employee, Component ID, Component, Type, Current amount, Action (KEEP/CHANGE/STOP), Amount this payroll, Effective date, Stop date / rule, Opening balance, New advance, Payment, Ending balance, Recipient / payee, Source, Notes]
    payroll_fields:
      BOH and FOH tips: reported_tips (retaining each pool)
      tips already paid: tips_paid_out when YES
      owner period pay: period_pay for this employee only
      recurring amount and installment payment: loan_deduction, subject to loan reconciliation
    one_time_pay_codes:
      BONUS: taxable_addition
      OTHER TAXABLE EARNING: taxable_addition
      REIMBURSEMENT: non_taxable_addition
      POST-TAX DEDUCTION: post_tax_deduction
    validation:
      - Require the matching company ID, start date, end date, pay date, and an attestation.
      - Require an employee ID on changed rows. Tips already paid accepts YES, NO, or blank.
      - A no-changes attestation cannot accompany changed rows.
      - Owner pay requires a positive amount, THIS EMPLOYEE ONLY, matching pay date, and a source.
      - One-time items require a supported type and category, positive amount, matching pay date, and source. Deductions also require a payee.
      - With a positive ending balance, opening plus advance minus payment must match ending within one cent.
      - Recurring setup changes, advances, and payroll amounts against a named loan or recurring component require review in Cornerstone.
      - Any populated A–J cell from row 2 on HOUR CORRECTIONS rejects the file. Unrecognized sheets are ignored.
  legacy:
    detection: absence of START HERE
    header_row: 4
    first_data_row: 5
    employee_match: fuzzy_name_against_active_roster
    metadata: Read the first available recognized sheet in the order below. Prefer exact dates in C2/C3, then fall back to F2/F3.
    sheets:
      TIPS - BOH: {C: last_name, D: first_name, F: tips_boh}
      TIPS - FOH: {C: last_name, D: first_name, F: tips_foh}
      LOANS (NO INSTALLMENTS): {C: last_name, D: first_name, F: recurring_loan_deduction}
      INSTALLMENT LOANS: {C: last_name, D: first_name, F: beginning_balance, G: new_amount, H: payment, I: estimated_ending_balance}
      BONUSES: {C: last_name, D: first_name, F: bonus}
    skipped_sheets: [SUMMARY]
    quirks:
      - Sheet headers are positional. The parser does not check header text.
      - The pay date must match. A one-day period-end difference warns, and a larger difference rejects the file.
      - Both tip pools are summed, and apply requires a choice of whether legacy tips were already paid.
      - Blank bonus is absent. Zero clears an imported bonus. Duplicate bonus rows are rejected.
      - Blank employee names are skipped, including amount totals with no employee name.
pay_period:
  length_days: 14
  workweek_starts_at_minutes: 0
  requires_confirmed_workweek: true
  source_reports_overtime: true
  misaligned_workweek: warn
  revel_dates: Both period boundaries must match. Dates come from the file name or report text.
