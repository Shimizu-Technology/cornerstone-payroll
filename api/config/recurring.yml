# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  post_employee_pay_stubs:
    class: PostEmployeePayStubsJob
    queue: default
    schedule: every 5 minutes

  # Employee app invites last 14 days; former-employee access ends on its date.
  expire_employee_links:
    class: ExpireEmployeeLinksJob
    queue: default
    schedule: "15 3 * * * Pacific/Guam"

  # The demo early-access rule ends on its own after its expiry date (M4-9d).
  close_expired_demo_early_access:
    class: CloseExpiredDemoEarlyAccessJob
    queue: default
    schedule: every 15 minutes

  # Re-enqueues demo kill switch Clerk revocations left without a job (M4-9d).
  retry_employee_app_clerk_revocations:
    class: RetryEmployeeAppClerkRevocationsJob
    queue: default
    schedule: every 15 minutes

  expire_practice_portal_access:
    class: ExpirePracticePortalAccessJob
    queue: default
    schedule: every minute

  # Sends pending or failed employee document notices and matches stored email
  # provider events to their notices (M4-5).
  dispatch_employee_tax_form_notices:
    class: DispatchEmployeeTaxFormNoticesJob
    queue: default
    schedule: every 10 minutes

  # Retries any employee-link activation security notices left pending or failed.
  # Sends notices to an employee's previous email that are still pending.
  retry_employee_email_change_notices:
    class: SendEmployeeEmailChangeNoticeJob
    queue: default
    schedule: every 15 minutes

  retry_employee_activation_notices:
    class: SendEmployeeActivationNoticeJob
    queue: default
    schedule: every 10 minutes

  retry_portal_upload_cleanups:
    class: PortalUploadCleanupJob
    queue: default
    schedule: every 5 minutes

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Activates scheduled pay-rate changes at 00:05 Guam time. Payroll resolves
  # rates by pay period end date; this refreshes the "today" cache columns.
  sync_effective_compensation:
    class: SyncEffectiveCompensationJob
    queue: default
    schedule: "5 0 * * * Pacific/Guam"

  # Activates due future-dated Client-managed employee lifecycle profiles at
  # Guam midnight and hourly as a backstop after rechecking preflight checks.
  activate_scheduled_lifecycle_modes:
    class: ActivateScheduledLifecycleModesJob
    queue: default
    schedule: "0 * * * * Pacific/Guam"

  send_payroll_reminders:
    class: SendPayrollRemindersJob
    queue: default
    schedule: every day at 7am

  # No-op until CORNERSTONE_TAX_API_URL and PAYROLL_WORK_HOURS_SECRET are set
  # and an organization has chosen its practice company (client profitability).
  refresh_tax_work_hours:
    class: TaxWorkHoursNightlyRefreshJob
    queue: default
    schedule: every day at 2am

  create_recurring_invoice_drafts:
    class: InvoiceRecurrenceDispatchJob
    queue: default
    schedule: every hour at minute 5

  dispatch_scheduled_invoice_emails:
    class: InvoiceSendDispatchJob
    queue: default
    schedule: every minute

  dispatch_aire_payroll_acknowledgements:
    class: AirePayrollAcknowledgementDispatchJob
    queue: default
    schedule: every 5 minutes

  dispatch_aire_payroll_calendar_sync:
    class: AirePayrollCalendarDispatchJob
    queue: default
    schedule: every minute

  dispatch_historical_client_bootstraps:
    class: HistoricalClientBootstrapDispatchJob
    queue: default
    schedule: every 5 minutes

  recover_abandoned_check_print_generations:
    class: CheckPrintGenerationRecoveryJob
    queue: default
    schedule: every 5 minutes

  recover_pending_client_document_scans:
    class: ClientDocumentScanRecoveryJob
    queue: default
    schedule: every 5 minutes

  # Records portal alert outcomes. Email sends only when
  # PORTAL_EMAIL_NOTIFICATIONS_ENABLED=true; otherwise due rows are skipped.
  dispatch_portal_notifications:
    class: PortalNotificationDispatchJob
    queue: default
    schedule: every minute
