default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Include Solid Queue's recurring command queue so scheduled maintenance
    # jobs (for example, clearing finished Solid Queue jobs) do not pile up.
    # Keep default first so user-facing jobs are always preferred.
    - queues: [ "default", "solid_queue_recurring" ]
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
    - queues: "ocr"
      threads: 1
      processes: 1
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
