default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Include Solid Queue's recurring command queue so scheduled maintenance
    # jobs (for example, clearing finished Solid Queue jobs) do not pile up.
    # Preserve payroll priority. Employee jobs run after both existing queues.
    - queues: <%= ENV.fetch("SOLID_QUEUE_QUEUES", "default,solid_queue_recurring,employee").split(",").map(&:strip).reject(&:empty?).to_json %>
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
    - queues: "ocr"
      threads: 1
      processes: 1
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
