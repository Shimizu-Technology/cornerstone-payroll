# OWASP ZAP baseline rules for the employee API surface (APP_PROCESS_ROLE=employee_web).
# The API serves JSON/empty responses, not HTML pages; browser-document-only headers
# (CSP, X-Frame-Options, Permissions-Policy, Spectre CORP/COEP) are marked IGNORE here
# while nosniff, CORS, error disclosure, and server/version leakage FAIL.

10038	IGNORE	JSON API does not render HTML documents (CSP lives on the web surface)
10020	IGNORE	JSON API does not render HTML documents (X-Frame-Options lives on the web surface)
10063	IGNORE	JSON API does not render HTML documents (Permissions-Policy lives on the web surface)
90004	IGNORE	JSON API does not render HTML documents (Spectre headers live on the web surface)
10049	IGNORE	API intentionally sends Cache-Control: no-store on employee routes
10015	IGNORE	API intentionally sends Cache-Control: no-store on employee routes
10096	IGNORE	JSON timestamps in health/API responses are expected
10027	IGNORE	Benign comments in health endpoint HTML (/up)

# Local loopback HTTP only; production API scan enforces HSTS separately.
10035	IGNORE	HSTS is enforced on Render HTTPS (use zap_baseline_api_production.conf in prod)

# Fail closed on API security regressions.
10021	FAIL	X-Content-Type-Options: nosniff must be present
10036	FAIL	Server version banner must not leak
10037	FAIL	X-Powered-By header must not leak
10098	FAIL	Cross-Domain Misconfiguration (wildcard CORS) must fail
10010	FAIL	Cookies without HttpOnly must fail
10011	FAIL	Cookies without Secure must fail
10054	FAIL	Cookies without SameSite must fail
90022	FAIL	Application Error Disclosure must fail
