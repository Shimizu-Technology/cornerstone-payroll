# OWASP ZAP baseline rules for the employee web surface (VITE_APP_SURFACE=employee).
# Local mode scans over plain loopback HTTP; production mode overrides HSTS to FAIL
# via zap_baseline_web_production.conf.
#
# Format: <rule-id>\t<IGNORE|WARN|FAIL>\t<reason>

# Clerk UI components and Google Fonts stylesheet intentionally use style-src 'unsafe-inline'
# and documented Clerk wildcards (see web/scripts/finalize-surface-dist.mjs).
10055	WARN	CSP includes documented style-src unsafe-inline and Clerk protect wildcard

# Third-party bundled JS comments / Unix timestamps in Vite chunks are benign noise.
10027	IGNORE	Suspicious comments in third-party Vite bundle chunks
10096	IGNORE	Timestamp disclosure in third-party bundle metadata

# Local loopback scan uses http://127.0.0.1; TLS/HSTS is enforced on Netlify HTTPS.
10035	IGNORE	Strict-Transport-Security only applies over HTTPS (enforced in production conf)
10040	IGNORE	Secure Pages Include Mixed Content N/A on loopback HTTP

# Intentionally no-store on all responses; ZAP sometimes warns on non-storable static files.
10049	IGNORE	Employee surface deliberately sends Cache-Control: no-store on every response
10015	IGNORE	Employee surface deliberately sends Cache-Control: no-store on every response

# Cross-Origin-Opener-Policy is set to same-origin-allow-popups for Clerk OAuth popups;
# Cross-Origin-Embedder-Policy / CORP are intentionally omitted for third-party Clerk assets.
90004	IGNORE	Spectre site isolation headers intentionally compatible with Clerk OAuth/assets

# Static harness serves prebuilt SPA shell without subresource integrity on self-hosted chunks.
90003	IGNORE	Self-hosted Vite hashed chunks do not require third-party SRI

# Fail closed on high-signal browser/header regressions.
10020	FAIL	X-Frame-Options must remain DENY
10021	FAIL	X-Content-Type-Options must remain nosniff
10038	FAIL	Content-Security-Policy header must be present
10036	FAIL	Server version banner must not leak
10037	FAIL	X-Powered-By header must not leak
10010	FAIL	Cookies without HttpOnly must fail
10011	FAIL	Cookies without Secure must fail
10054	FAIL	Cookies without SameSite must fail
10098	FAIL	Cross-Domain Misconfiguration must fail
